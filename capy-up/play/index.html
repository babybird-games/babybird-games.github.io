function bgmPick(){   // đổi sang một bài nhạc ván khác bài vừa nghe

function bgmSync(){
  const quiet = muted || bgmHeld || document.hidden || !bgmOn;
  if (!quiet && !menuA){
    menuA = new Audio(BGM_MENU); menuA.loop = true; menuA.volume = 0.32;
    gameA = new Audio(); gameA.volume = 0.32; gameA.addEventListener('ended', () => { bgmPick(); bgmSync(); });

    bgmPick();
  }
  if (!menuA) return;
  const want = quiet ? null : bgmMode === 'menu' ? menuA : bgmMode === 'game' ? gameA : null;
  for (const a of [menuA, gameA]) if (a !== want && !a.paused) a.pause();

}

function type(n, hw, hh, soft, fn, back){

  const d = x.getImageData(0, 0, SP, SP).data; let lo = SP, hi = -1;
  for (let j = 0; j < SP; j++) for (let i = 0; i < SP; i++) if (d[(j * SP + i) * 4 + 3] > 80){ if (i < lo) lo = i; if (i > hi) hi = i; }

function catTail(col){
  return (x, r, t) => {
    const a = Math.sin(t * 3.4) * 0.38 + Math.sin(t * 1.3) * 0.12, bx = r * 0.56, by = r * 0.62;
    const rot = (px, py, k) => [bx + (px * Math.cos(a * k) - py * Math.sin(a * k)) * r, by + (px * Math.sin(a * k) + py * Math.cos(a * k)) * r];
    const [c1x, c1y] = rot(0.5, 0.0, 0.5), [ex, ey] = rot(0.42, -0.62, 1);
    const path = () => { x.beginPath(); x.moveTo(bx, by); x.quadraticCurveTo(c1x, c1y, ex, ey); };
    x.strokeStyle = OUT; x.lineWidth = r * 0.3; path(); x.stroke();
    x.strokeStyle = col; x.lineWidth = r * 0.15; path(); x.stroke();
  };
}

function softBlob(c, x, y, rx, ry, a){

function castShadow(lower, sx, sy, rx, ry){
  const m = g.getTransform(), half = lower.kr * 2.1, bx = lower.x - half, by = lower.y - half, sz = half * 2;
  const pw = Math.ceil(sz * m.a), ph = Math.ceil(sz * m.d);
  if (pw < 2 || ph < 2) return;
  if (shCv.width < pw) shCv.width = pw; if (shCv.height < ph) shCv.height = ph;
  shG.setTransform(1, 0, 0, 1, 0, 0); shG.globalCompositeOperation = 'source-over'; shG.clearRect(0, 0, pw, ph);
  shG.setTransform(m.a, 0, 0, m.d, -bx * m.a, -by * m.d);
  drawItem(lower.e, lower.x, lower.y, lower.kr, lower.rot, lower.sq, lower.cs, shG);
  shG.globalCompositeOperation = 'source-in';   // chỉ giữ phần bóng nằm trên hình món dưới
  softBlob(shG, sx, sy, rx, ry, 0.32);
  shG.globalCompositeOperation = 'source-over';
  g.drawImage(shCv, 0, 0, pw, ph, bx, by, sz, sz);
}

  x.moveTo(pts[0][0], pts[0][1]);

  x.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
}
function rock(x, rg, x0, y0, w, h){

  pts.push([x0 + w * 1.05, y0 + h * 0.5]);
  const path = () => { x.beginPath(); smooth(x, pts); x.closePath(); };
  const gr = x.createLinearGradient(0, y0 - h * 1.1, 0, y0 + h * 0.5);
  gr.addColorStop(0, '#d9d4c8'); gr.addColorStop(0.5, '#9a968e'); gr.addColorStop(1, '#5e5c5a');

const wh = new Float32Array(NW), wv = new Float32Array(NW);
const wIdx = x => Math.max(0, Math.min(NW - 1, Math.round(x / VW * (NW - 1))));
function stepWater(dt){
  for (let i = 0; i < NW; i++){
    const l = wh[i ? i - 1 : 0], r = wh[i < NW - 1 ? i + 1 : NW - 1];
    wv[i] += (-40 * wh[i] + 900 * (l + r - 2 * wh[i])) * dt;
    wv[i] *= 1 - 1.3 * dt;
  }
  for (let i = 0; i < NW; i++) wh[i] = Math.max(-40, Math.min(40, wh[i] + wv[i] * dt));
}
function splash(x, vy, quiet){
  const i = wIdx(x), p = Math.min(vy, 900) * 0.3;
  wv[i] -= p; if (i) wv[i - 1] -= p * 0.5; if (i < NW - 1) wv[i + 1] -= p * 0.5;
  if (quiet) return;
  s.ripples.push({ x, t: 0 });
  const n = Math.min(14, 5 + vy / 110);
  for (let k = 0; k < n; k++)
    s.parts.push({ x: x + crnd(-10, 10), y: WL - 2, vx: crnd(-160, 160), vy: -crnd(140, 170 + vy * 0.45), life: 1, sz: crnd(2, 5), col: '#eafcff' });

  1: ['Hồng', 'Persimmon', "Quả hồng chín mọng mùa thu. Capy thèm lắm, nhưng nó nằm ngay trên đầu nên với kiểu gì cũng không tới.", "A ripe autumn persimmon. The capybara would love a bite, but it sits right on top of its head. Forever out of reach."],
  2: ['Táo', 'Apple', "Có người bị một quả táo rơi trúng đầu rồi nghĩ ra cả một định luật vật lý. Capy bị rơi trúng cả chồng mà vẫn chưa nghĩ ra gì.", "Someone once got bonked by an apple and came up with a law of physics. The capybara has been bonked by a whole stack and still has no theories."],

  4: ['Trứng', 'Egg', "Một quả trứng còn nguyên vỏ. Capy giữ nhẹ nhàng lắm, vì không ai muốn gội đầu bằng lòng đỏ.", "A whole egg, shell intact. The capybara balances it very gently. Nobody wants a yolk shampoo."],
  5: ['Dưa hấu', 'Watermelon', "To, tròn, nặng trịch. Ngày hè mà có quả dưa ướp lạnh thì còn gì bằng. Cổ capy thì không nghĩ vậy.", "Big, round and heavy. Nothing beats a chilled watermelon on a summer day. The capybara's neck disagrees."],
  6: ['Đào', 'Peach', "Truyện cổ kể có cậu bé chui ra từ quả đào trôi sông, lớn lên đi đánh quỷ. Quả này mở ra chỉ có hạt.", "An old tale says a boy once popped out of a peach floating down a river and grew up to fight ogres. This one only has a pit."],
  7: ['Cơm nắm', 'Rice ball', "Cơm nắm tam giác bọc rong biển, món không thể thiếu trong hộp cơm đi dã ngoại. Capy để dành ăn sau khi tắm xong.", "A triangle rice ball wrapped in seaweed, the star of every picnic box. The capybara is saving it for after the bath."],
  8: ['Vịt', 'Duck', "Không rõ là vịt cao su hay vịt thật. Chỉ biết nó kêu quạc quạc và bơi giỏi hơn capy.", "Rubber duck or real duck? Nobody knows. It quacks, and it swims better than the capybara."],
  9: ['Ếch', 'Frog', "Ếch thích ngồi chỗ cao để ngắm cho xa. Đầu capy là chỗ ngắm cảnh đẹp nhất suối này.", "Frogs love a high spot with a good view. The capybara's head is the best lookout at the whole spring."],
  10: ['Bánh flan', 'Pudding', "Bánh flan rung rinh dưới lớp caramel. Chồng đồ lắc thì nó lắc theo, rất có tinh thần đồng đội.", "A wobbly pudding under a caramel top. When the stack sways, it sways along. Real team spirit."],
  11: ['Capy con', 'Baby capy', "Một bé capy nằm bò. Capy không chắc đây là con nhà ai, nhưng cứ để trên đầu cho ấm đã.", "A baby capybara, lying flat. Nobody is sure whose baby it is, but it's warm up there, so it stays."],
  12: ['Đậu hũ', 'Tofu', "Có anh chàng mỗi sáng lái xe đổ đèo đi giao đậu hũ mà không làm đổ ly nước để trong xe. Capy cũng đang tập giữ thăng bằng như vậy.", "A certain delivery boy drives tofu down a mountain pass every morning without spilling a cup of water. The capybara is training the same balance."],
  13: ['Mochi', 'Mochi', "Tròn, trắng, dẻo. Nhìn kỹ thì giống mặt capy lắm, chỉ thiếu cái mũi to.", "Round, white and squishy. Squint a little and it looks just like a capybara face, minus the big nose."],
  14: ['Xô gỗ', 'Wooden bucket', "Xô gỗ ở nhà tắm công cộng Nhật, tắm xong ai cũng xếp chồng lên nhau. Capy khẳng định cái này là xô của capy.", "The wooden bucket from a Japanese bathhouse, always stacked up after use. The capybara insists this one is its own."],
  15: ['Rùa', 'Turtle', "Thắng thỏ trong một cuộc chạy đua, nổi tiếng cả đời. Ngồi trên đầu capy rồi thì cũng chẳng vội đi đâu nữa.", "Won one race against a hare and has been famous ever since. Now it has nowhere to hurry to."],
  16: ['Mèo', 'Cat', "Mèo thích chỗ cao, chỗ ấm, và ai đó ngồi yên không nhúc nhích. Đầu capy đạt đủ cả ba.", "Cats love high places, warm places, and someone who sits very still. The capybara's head checks all three."],
  17: ['Sữa', 'Milk', "Người lớn bảo uống sữa cho cao. Capy không uống mà mỗi ngày vẫn cao thêm, nhờ chồng đồ trên đầu.", "Drink your milk and you'll grow tall, they say. The capybara grows taller every day without it, thanks to the stack."],
  18: ['Donut', 'Donut', "Bánh donut phủ kem hồng. Có một ông bố da vàng ở thị trấn nọ mê món này hơn mọi thứ trên đời.", "Pink frosting, sprinkles on top. A certain yellow-skinned dad in a certain town loves these more than anything."],
  19: ['Hộp quà', 'Gift box', "Hộp quà thắt nơ. Bên trong là gì thì chưa ai biết, vì mở ra là đổ cả chồng.", "A box with a bow on top. Nobody knows what's inside, because opening it would topple the whole stack."],
  20: ['Ấm trà', 'Teapot', "Truyện cổ kể có con lửng biến thành ấm trà rồi không biến lại được. Ấm này... chắc là ấm thật.", "An old tale tells of a raccoon dog who turned into a teapot and got stuck that way. This one is... probably just a teapot."],
  21: ['Xương rồng', 'Cactus', "Xương rồng nhỏ trong chậu, dễ nuôi, gần như không cần tưới. Capy thì ngược lại, sống luôn trong nước.", "A little potted cactus. Easy care, barely needs water. The capybara is the opposite: it lives in the water."],
  22: ['Sushi', 'Sushi', "Sushi cá hồi buộc dải rong biển. Ở tiệm băng chuyền thì sushi đi vòng vòng. Ở đây thì nó đi lên trời.", "Salmon sushi with a seaweed belt. At a conveyor belt shop it goes around and around. Here it goes up."],
  23: ['Ngôi sao', 'Star', "Ngôi sao vàng nhấp nháy. Nghe nói chạm vào là chạy nhanh như gió, nhạc nổi lên dồn dập, chẳng sợ gì nữa. Capy chạm rồi. Capy vẫn đi chậm.", "A twinkly golden star. Touch it, they say, and you run like the wind while fast music plays and nothing can hurt you. The capybara touched it. Still slow."],
  24: ['Nấm', 'Mushroom', "Mũ đỏ chấm trắng như trong truyện cổ tích. Có người bảo ăn vào thì to gấp đôi. Đừng ăn nấm lạ ngoài đời nha, thật đấy.", "Red cap, white spots, straight from a fairy tale. Some say eating one makes you twice as big. Please don't eat wild mushrooms. Seriously."],
  25: ['Slime', 'Slime', "Cục thạch xanh hình giọt nước, lúc nào cũng cười. Nghe nói là quái vật đầu tiên mọi dũng sĩ gặp trên đường phiêu lưu. Capy thấy nó hiền khô.", "A blue droplet of jelly that never stops smiling. They say it's the first monster every hero meets on their quest. The capybara thinks it's a sweetheart."],
  26: ['Ngọc ước', 'Wish orb', "Viên ngọc cam có mấy ngôi sao đỏ bên trong. Gom đủ bảy viên thì gọi được rồng thần và ước một điều. Capy mới có một viên, nên ước được một phần bảy điều.", "An orange orb with little red stars inside. Collect all seven to summon a dragon and make a wish. The capybara has one, so it gets one seventh of a wish."],
  27: ['Mũ rơm', 'Straw hat', "Chiếc mũ rơm có dải băng đỏ. Chủ của nó là một cậu bé người cao su, hứa sẽ trả mũ khi trở thành vua của biển cả. Capy giữ hộ, nhưng không hứa giữ khô.", "A straw hat with a red band. Its owner, a rubbery boy, promised to return it once he becomes king of the seas. The capybara is holding it, but can't promise it stays dry."],
  28: ['Mì ramen', 'Ramen', "Ramen nóng hổi có trứng và chả cá xoắn. Có cậu ninja tóc vàng ăn món này ba bữa một ngày mà vẫn chạy nhảy khắp làng.", "Hot ramen with an egg and a swirly fish cake. A certain blond ninja eats this three times a day and still runs all over the village."],
  29: ['Dorayaki', 'Dorayaki', "Hai lớp bánh xốp kẹp nhân đậu đỏ. Món khoái khẩu của một chú mèo máy màu xanh không có tai. Capy cũng thích, món này capy ăn được.", "Two fluffy pancakes with sweet bean filling. The favorite snack of a certain blue robot cat with no ears. The capybara approves. This one it can eat."],
  30: ['Dango', 'Dango', "Ba viên bánh dẻo ba màu xiên que. Có hẳn một bài hát nổi tiếng về cả đại gia đình bánh dango.", "Three chewy dumplings in three colors on a stick. There's even a famous song about a whole big dango family."],
  31: ['Bánh đậu', 'Bean bun', "Bánh nhân đậu đỏ tròn trịa. Có một anh hùng mang cái đầu làm bằng bánh này, thấy ai đói là bẻ đầu mời ăn.", "A round bun with sweet bean filling. There's a hero whose head is made of one, and he shares a piece with anyone who's hungry."],
  32: ['Bánh dưa lưới', 'Melon bread', "Bánh mì vỏ giòn kẻ ô. Tên là bánh dưa lưới nhưng không có miếng dưa nào cả. Có cô nàng tóc đỏ rực mê món này, đánh nhau xong là phải có một cái.", "A crunchy bun with a grid pattern. Called melon bread, yet there's no melon in it. A certain fiery-haired girl needs one after every battle."],
  33: ['Takoyaki', 'Takoyaki', "Bánh bạch tuộc viên rưới sốt, rắc cá bào. Cá bào trên bánh nhảy múa là vì nóng, không phải vì nhạc.", "Octopus balls with sauce and bonito flakes. The flakes dance because it's hot, not because of the music."],
  34: ['Taiyaki', 'Taiyaki', "Bánh hình con cá nhân đậu đỏ. Hỏi người ta ăn từ đầu hay từ đuôi là đoán được tính cách. Capy thì ăn từ giữa.", "A fish-shaped cake with sweet filling. Ask someone if they start from the head or the tail and you'll learn their personality. The capybara starts in the middle."],
  35: ['Bóng chuyền', 'Volleyball', "Có một cậu nhóc thấp bé mà bật cao như bay, chỉ cần đồng đội chuyền bóng đúng chỗ. Capy cũng bật cao được. Trong mơ.", "There's a short kid who jumps like he can fly, as long as his setter puts the ball in the right spot. The capybara can jump that high too. In its dreams."],
  36: ['Bóng rổ', 'Basketball', "Có anh chàng tóc đỏ mới chơi bóng rổ vài tuần đã tự xưng là thiên tài, ném hỏng thì đổ tại rổ.", "A certain red-haired rookie calls himself a basketball genius after a few weeks of practice, and blames the hoop when he misses."],
  37: ['Bóng đá', 'Soccer ball', "Có cậu bé coi trái bóng là bạn thân nhất, ước mơ vô địch thế giới. Capy thì coi trái bóng là đồ để đội.", "There's a boy who calls the ball his best friend and dreams of winning the world cup. The capybara calls it a hat."],
  38: ['Daruma', 'Daruma', "Búp bê không bao giờ ngã, đẩy kiểu gì cũng tự đứng lên. Ước một điều thì tô một mắt, thành rồi mới tô mắt còn lại. Capy muốn học nó cách đứng vững.", "The doll that never falls over: push it and it pops right back up. Paint one eye when you make a wish, the other when it comes true. The capybara wants lessons."],
  39: ['Kẹo sao', 'Star candy', "Kẹo đường gai nhỏ xíu đủ màu. Có một đám bụi đen lông xù trong nhà tắm cổ mê món này lắm, rắc ra là kéo nhau đến.", "Tiny spiky sugar candies. A crowd of fuzzy black soot balls in an old bathhouse goes crazy for these. Sprinkle a few and they all come running."],
  40: ['Quả sồi', 'Acorn', "Có ai đó cứ lặng lẽ để quả sồi trước hiên nhà. Gieo xuống rồi nửa đêm múa một điệu lạ cùng ông bạn xám to đùng thì sáng ra thành cây cao. Capy múa thử rồi, chỉ thấy mỏi chân.", "Someone keeps leaving acorns on the porch. Plant them, do a strange midnight dance with a big gray forest friend, and they'll be a tree by morning. The capybara tried. Just sore legs."],
  41: ['Chuông', 'Bell', "Chiếc chuông vàng đeo cổ của một chú mèo máy màu xanh. Lắc chỉ kêu lục cục. Nghe đồn chủ nó sợ nhất trên đời là chuột.", "The golden collar bell of a certain blue robot cat. Shake it and it just rattles. Rumor says its owner is terrified of mice."],
  42: ['Bụi than', 'Soot ball', "Cục bụi đen lông xù sống ở góc tối nhà cũ. Ném vài viên kẹo sao xuống là cả đám kéo ra. Đừng bóp mạnh, tay sẽ đen thui.", "A fuzzy black soot ball from the dark corners of old houses. Toss a few star candies and the whole gang shows up. Don't squeeze. Your hands will turn black."],
  43: ['Trái lạ', 'Weird fruit', "Trái cây vân xoắn, mùi vị nghe nói kinh khủng. Ăn vào sẽ có sức mạnh lạ, đổi lại cả đời không bơi được nữa. Capy không bỏ suối nước nóng được đâu, nên thôi.", "A swirly fruit that supposedly tastes awful. Eat it and you get a strange power, but you can never swim again. The capybara is not giving up hot springs, so no thanks."],
  44: ['Mèo đen', 'Black cat', "Chú mèo đen hay ngồi sau cán chổi của một cô phù thủy nhỏ đi giao hàng. Nói được tiếng người, nhưng chỉ với cô chủ. Capy hỏi gì nó cũng chỉ meo.", "A black cat who rides on the broom of a young witch's delivery service. It can talk, but only to her. Whatever the capybara asks, it just says meow."],
  45: ['Hộp caro', 'Checkered box', "Hoa văn caro xanh đen này quen quen, giống áo khoác của một cậu bé bán than. Cậu hay đeo theo một chiếc hộp gỗ sau lưng, ban ngày tuyệt đối không mở.", "That green and black check looks familiar, just like the coat of a certain charcoal-selling boy. He carries a wooden box on his back that must never be opened in daylight."],
  46: ['Đá quý', 'Gem', "Viên ngọc hồng trong khung vàng hình quả trứng. Nghe nói là của một cô gái phép thuật đã ký khế ước với một con thú trắng mắt đỏ. Giữ cho ngọc đừng đục đi nhé.", "A pink gem in an egg-shaped golden frame. They say it belongs to a magical girl who made a contract with a white, red-eyed creature. Keep it sparkly."],
  47: ['Kẹp tóc', 'Hair clip', "Chiếc kẹp tóc biết nói, thật ra là một robot. Nó biến được thành mọi bộ đồ cho cô công chúa ngoài hành tinh có cái đuôi nhọn. Chỉ cần đừng để nó hết năng lượng giữa chừng.", "A talking hair clip that is secretly a robot. It can turn into any outfit for an alien princess with a pointy tail. Just don't let it run out of power halfway."],
  48: ['Chong chóng tre', 'Bamboo copter', "Gắn lên đầu là bay được, nghe nói vậy. Capy thử rồi, chỉ thấy mát đầu.", "Stick it on your head and you can fly, supposedly. The capybara tried. Its head just got a nice breeze."],
  49: ['Bánh mì ghi chữ', 'Memo toast', "Áp lát bánh lên trang sách là chữ in lên bánh, ăn vào là nhớ hết bài. Chỉ đừng ăn nhiều quá, đau bụng là quên sạch.", "Press it on a page and the words print onto the toast. Eat it and you'll remember everything. Just don't overdo it. One tummy ache and it's all gone."],
  50: ['Thạch konnyaku', 'Konjac jelly', "Ăn một miếng là hiểu được mọi ngôn ngữ. Capy ăn rồi, giờ capy hiểu được tiếng vịt.", "One bite and you can understand any language. The capybara had some. Now it understands the duck."],
  51: ['Túi bán nguyệt', 'Half-moon pocket', "Chiếc túi trắng hình nửa vầng trăng, nghe nói chứa được vô số đồ. Chủ cũ của nó lúc nào cũng cuống lên lục mãi không ra đúng món.", "A white half-moon pocket that supposedly holds endless gadgets. Its owner always panics and pulls out everything except the one he needs."],
  53: ['Thanh long', 'Dragon fruit', "Vỏ hồng rực, tai xanh vểnh tứ phía như một chú rồng con. Tên là rồng mà chẳng phun lửa, bổ ra chỉ có ruột trắng lấm tấm hạt đen.", "Bright pink skin with green flames sticking out all over, like a baby dragon. Despite the name, it breathes no fire. Cut it open and it's just white with tiny black seeds."],
  54: ['Bí ngô', 'Pumpkin', "Dẹt, nhiều múi, đáy phẳng, đội lên đầu vững nhất vùng. Truyện cổ kể có quả bí hóa thành cỗ xe lúc nửa đêm. Quả này qua nửa đêm vẫn là bí.", "Squat, ribbed and flat-bottomed: the most stable hat around. Legend says one turned into a carriage at midnight. This one is still a pumpkin after midnight."],
  55: ['Khóm', 'Pineapple', "Miền Nam gọi là khóm, miền Bắc gọi là dứa, có nơi gọi là thơm, mà vẫn là một trái. Đội vương miện lá như một ông vua nhỏ, nhưng lên đầu capy rồi thì vua cũng phải ngồi yên.", "Some call it pineapple, some call it ananas. Either way, it wears a leafy crown like a little king. But up here on the capybara's head, even kings have to sit still."],
  56: ['Dưa lưới', 'Melon', "Dưa lưới thật đây, bổ ra có dưa hẳn hoi. Không như anh bạn bánh dưa lưới bên tab Đồ ăn, chỉ được cái tên.", "The real melon, with actual melon inside. Unlike its friend the melon bread over in Snacks, which is melon in name only."],
  52: ['Đèn pin', 'Flashlight', "Chiếu vào cái gì là cái đó nhỏ lại. Chắc vì vậy mà món nào cũng vừa vặn đội trên đầu capy.", "Whatever it shines on shrinks. That's probably why everything fits so nicely on the capybara's head."]

// số lần đã đội từng món và các món mới mở chưa xem trong sách; lưu cùng chỗ với kỷ lục
let bookN = {}, bookNew = [], bookDirty = false;
try { bookN = JSON.parse(store.get('ccc_book', '{}')) || {}; bookNew = JSON.parse(store.get('ccc_booknew', '[]')) || []; } catch (e){ bookN = {}; bookNew = []; }
function bookSave(){ bookDirty = false; store.set('ccc_book', JSON.stringify(bookN)); store.set('ccc_booknew', JSON.stringify(bookNew)); }
// gọi khi món đáp xuống chồng; trả về true nếu là món lần đầu gặp
function bookAdd(e){
  if (!BOOK[e]) return false;
  const fresh = !bookN[e];
  bookN[e] = (bookN[e] || 0) + 1;
  if (fresh){ bookNew.push(e); bookSave(); } else bookDirty = true;
  return fresh;
}
const bookFlush = () => { if (bookDirty) bookSave(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) bookFlush(); });

const steam = [];
// sợi khói trang trí: [vị trí ngang theo tỉ lệ màn hình, lệch pha, cỡ]; chừa khoảng giữa cho capy
const STEAM_WISPS = [[0.05, 0, 1], [0.13, 0.45, 0.8], [0.21, 0.2, 0.9], [0.79, 0.65, 0.9], [0.87, 0.1, 1], [0.95, 0.55, 0.8]];
let resetExtra = null;
const mkLeaves = () => Array.from({ length: 6 }, (_, i) => ({ x: crand(), y: -crand() * 300, ph: crand() * 6, float: i < 3, c: ['#d9502e', '#ee8a3c', '#c8432b'][i % 3] }));
let leaves = mkLeaves();
// rp: bản ghi để xem lại; không có thì là ván mới (bắt đầu ghi)
function reset(rp){
  play = rp ? { d: rp, k: 0, e: 0 } : null;   // k: số bước đã chạy lại, e: lần chạm kế tiếp
  const v = play ? { VW: rp.VW, VH: rp.VH } : null;
  if (v || view){ view = v; resize(); }
  const seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) | 0;
  rs = seed; rs2 = seed ^ 0x5bd1e995; tick = 0; speed = 1;
  rec = play ? null : { fmt: 3, sv: SIM_VER, VW, VH, s0: null, ev: [], score: 0, secs: 0 };
  wh.fill(0); wv.fill(0); steam.length = 0; lastThud = lastPlop = lastCreak = 0; leaves = mkLeaves();
  if (resetExtra) resetExtra();
  s = { t: 0, items: [], combo: 0, score: 0, ph: rnd(0, 6), swayPh: 0, B: 0, baseU: 0, baseV: 0, load: 0,
        bob: 0, bobV: 0, zone: 0, fall: null, next: mk(), nextT: 0, over: false, overT: 0, sneezeT: 0, cam: 0,
        pops: [], bodies: [], parts: [], rings: [], ripples: [], shake: 0, stop: 0, straight: 0, danger: 0,
        say: null, sayT: 0, blink: 0, newBest: false, why: '', ask: false, askT: 0, revived: false, seen: {}, evoT: 0, lifeT: 0,
        lives: premium ? 2 : 1, lifeMax: premium ? 2 : 1, bonus: false,
        go: false, tip: '', tipT: 0, tips: {}, spd: 0 };   // go: đã bấm Bắt đầu (rời màn hình chờ); tip: mẹo cho người mới, không ghi vào replay   // mạng dự phòng còn lại / số ô tim đang hiện / đã nhận mạng thưởng của ván chưa
  if (play){   // xem lại: dựng đúng trạng thái lúc bấm bắt đầu
    const d = rp; s = JSON.parse(JSON.stringify(d.s0)); rs = d.rs; rs2 = d.rs2; wh.set(d.w[0]); wv.set(d.w[1]);
    lastThud = d.lt[0]; lastPlop = d.lt[1]; lastCreak = d.lt[2];
  }
}
reset();
const X = it => cx + it.dx + it.u;
const Y = it => -it.h + s.bob;
const SY = y => baseY + y + s.cam;

function pop(txt, x, y, color, size){
  size = size || 22; x = clamp(x, 70, VW - 70);
  // nếu đụng một dòng chữ vừa hiện thì đẩy dòng mới lên trên nó
  for (let n = 0; n < 8; n++){
    const hit = s.pops.find(q => q.t < 0.7 && Math.abs(q.y - q.t * 50 - y) < (q.size + size) * 0.62 && Math.abs(q.x - x) < (q.txt.length * q.size + txt.length * size) * 0.3);
    if (!hit) break;
    y = hit.y - hit.t * 50 - (hit.size + size) * 0.64;
  }
  s.pops.push({ txt, x, y, t: 0, color: color || '#fff', size });
}
function burst(x, y, n, col, sp){
  for (let k = 0; k < n; k++){
    const a = crnd(0, Math.PI * 2), v = crnd(sp * 0.4, sp);
    s.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.4, life: 1, sz: crnd(2, 4.5), col });
  }
}

function act(a){
  if (rec && rec.s0) rec.ev.push([tick - rec.t0, a]);   // ghi bước mô phỏng sắp chạy và thao tác
  if (a === 'd') doDrop(); else if (a === 'r') revive(); else if (a === 'f') finish();
}
function input(a){
  if (play) return;
  if (a === 'd' ? (s.over || s.fall || !s.next || s.nextT < 0.6) : !s.ask) return;
  act(a);
}
function drop(){
  if (play) return;
  if (s.over){ if (!s.ask && s.overT > 1.4 && !s.items.length){ reset(); s.go = true; } return; }
  if (!s.go){ startGame(); return; }
  input('d');
}
// bấm Bắt đầu: rời màn hình chờ; lần đầu mở game thì hiện màn Cách chơi trước
function startGame(){
  if (s.go || play) return;
  if (store.get('ccc_tut', '') !== '1'){ help = { then: true }; return; }
  s.go = true;
}
function doDrop(){
  if (s.over || s.fall || !s.next || s.nextT < 0.6) return;
  s.fall = { x: cx + range * Math.sin(s.ph), y: dropY - baseY - s.cam, vy: 0, a: 0, va: rnd(-1.2, 1.2), e: s.next.e, k: s.next.k };
  s.next = null;
  beep(220, 0.06, 'triangle', 0.05);
}

function toBody(x, y, vx, vy, e, k, a){
  const t = T[e];
  s.bodies.push({ x, y, vx, vy, a: a || 0, va: rnd(-1.5, 1.5), r: k * R * Math.sqrt(t.hw * t.hh), m: k * k * t.hw * t.hh * t.dn, e, k, wet: false });
}
// gãy chồng ở khớp i: mọi món từ i trở lên rơi tự do
function breakAt(i){
  const its = s.items;
  for (let j = i; j < its.length; j++) toBody(X(its[j]), Y(its[j]), its[j].v + rnd(-14, 14), 0, its[j].e, its[j].k);
  its.length = i;
  s.shake = Math.max(s.shake, 8);
}
function gameOver(why){
  bookFlush();
  if (s.over) return;
  s.over = true; s.overT = 0; s.why = why; s.fall = null;
  buzz(80);   // tiếng báo thua là file âm thanh, phát ở bgmSet('off')
  if (s.lives > 0){ s.ask = true; s.askT = 6; } else finish();
}
// kết thúc ván thật sự: capy hắt xì, chốt kỷ lục
function finish(){
  s.ask = false; s.overT = 0; s.sneezeT = 1.1;
  if (play) return;
  rec.score = s.score; rec.date = new Date().toISOString(); rec.secs = Math.round((tick - rec.t0) / 180); lastRec = rec;
  if (s.score > best){ best = s.score; s.newBest = true; store.set('ccc_best', String(best)); }
  if (boardOn && AH && AH.boardSubmit) AH.boardSubmit(String(s.score));
}
// dùng một mạng dự phòng để chơi tiếp. Mỗi ván có 1 mạng, thêm 1 nếu đã mua gói, thêm 1 khi thả chuẩn 10 lần liên tiếp (một lần mỗi ván).
function revive(){
  if (!s.ask) return;
  s.ask = false; s.revived = true; s.lives--; s.over = false; s.fall = null; s.next = mk(); s.nextT = 0; s.combo = 0; s.shake = 4;   // giữ nguyên vị trí chồng đồ, chỉ cho nó đứng yên lại
  for (const it of s.items) it.v = 0;
  pop('Hồi sinh!', cx, VH * 0.42 - baseY - s.cam, '#ff8fa3', 38);
  pop(s.lives > 0 ? 'Còn ' + s.lives + ' mạng dự phòng' : 'Hết mạng dự phòng, rớt nữa là thua', cx, VH * 0.42 + 40 - baseY - s.cam, '#ffe9a8', 17); s.lifeT = 1;
  beep(520, 0.12, 'triangle', 0.1); beep(780, 0.25, 'triangle', 0.09);
  speak(SAY_REV, 1, true);
}
function sneeze(){
  const its = s.items, n = its.length;
  for (let j = 0; j < n; j++)
    toBody(X(its[j]), Y(its[j]), its[j].v + rnd(-90, 90) + (j / n) * rnd(-140, 140), -rnd(220, 560), its[j].e, its[j].k);
  its.length = 0;
  s.bobV -= 300; s.shake = 14; s.blink = 0.5;
  pop('HẮT XÌ!!', cx + s.baseU, s.bob - 40, '#fff', 34);
  splash(cx + s.baseU - 100, 420); splash(cx + s.baseU + 100, 420);
  noise(0.35, 0.3, 1900); buzz(60);
}

function miss(f, d){
  toBody(f.x, f.y, 0, f.vy, f.e, f.k, f.a);
  if (Math.abs(d) < 60) pop('Suýt!!', f.x, f.y - 30, '#ffd34d', 26);
  gameOver('Rớt rồi!');
}

function stick(f, d, gb, tol, first){
  const its = s.items, top = its[its.length - 1];
  const perfect = Math.abs(d) <= 0.3 * HW(f), de = perfect ? 0 : d;
  const gap = first ? gb : gb * (1 - 0.22 * (de / tol) * (de / tol));
  const it = top
    ? { dx: top.dx + de, u: top.u, v: top.v, gap, h: top.h + gap, k: f.k, e: f.e, sq: 0.3, sqv: 0, cs: 0 }
    : { dx: de, u: s.baseU, v: s.baseV, gap, h: gap, k: f.k, e: f.e, sq: 0.3, sqv: 0, cs: 0 };
  // sóng nén truyền xuống chồng (món mềm bẹp nhiều hơn)
  for (let j = its.length - 1, a = 5; j >= 0 && a > 0.3; j--, a *= 0.62) its[j].sqv += a * Math.min(2, 0.6 + T[its[j].e].soft * 0.4);
  its.push(it);
  s.score++; s.fall = null; s.next = mk(); s.nextT = 0;
  s.bobV += 70 + f.vy * 0.06;
  splash(cx + s.baseU - 90, 110, true); splash(cx + s.baseU + 90, 110, true);
  const px = X(it), py = Y(it) + HH(it) * 0.8;
  if (perfect){
    s.combo++;
    const fix = 1 - 0.05 * Math.min(s.combo, 4);   // Chuẩn kéo thẳng tăng dần theo chuỗi: 5%, 10%, 15%, rồi 20% mỗi lần; mỗi 5 lần liên tiếp có thêm "Thẳng tắp!" kéo thẳng một nửa
    for (const o of its){ o.v *= 0.55; o.dx *= fix; }
    s.rings.push({ x: px, y: Y(it), t: 0 });
    burst(px, py, 10, '#fff3a8', 220);
    s.stop = 0.035; s.shake = Math.max(s.shake, 2.5);
    pop(s.combo > 1 ? 'Chuẩn x' + s.combo : 'Chuẩn!', px, py - 44, '#8dffb0', 22 + Math.min(s.combo, 8));
    beep(520 * Math.pow(2, Math.min(s.combo, 14) / 12), 0.14, 'sine', 0.13);
    if (s.combo % 5 === 0){ s.straight = 0.7; pop('Thẳng tắp!', cx, py - 84, '#7fe0ff', 30); beep(1040, 0.3, 'triangle', 0.1, 1560); speak(SAY_NICE, 0.7); }
    if (s.combo >= BONUS_N && !s.bonus){   // phần thưởng cho chồng đồ thẳng: thêm một mạng, mỗi ván một lần
      s.bonus = true; s.lives++; s.lifeMax++; s.lifeT = 1;
      pop('+1 mạng!', cx, py - 124, '#ff8fa3', 34); speak(['ồ. tim.'], 1, true); beep(660, 0.14, 'triangle', 0.1); beep(990, 0.3, 'triangle', 0.09);
    }
    buzz(12);
  } else {
    s.combo = 0;
    it.v += de * 7; if (top) top.v += de * 3;
    burst(px - de * 0.5, py, 7, f.e ? '#fff' : '#ffb24d', 170);
    s.shake = Math.max(s.shake, 2 + Math.abs(de) * 0.12);
    if (Math.abs(de) > tol * 0.35) tip('aim');
    if (Math.abs(de) > tol * 0.7){ pop('Ối…', px, py - 44, '#ffd34d', 22); speak(SAY_WOB, 0.6); }
    beep(300, 0.08, 'triangle', 0.1); buzz(6);
  }
  const fresh = !play && bookAdd(f.e);
  if (T[f.e].n && !s.seen[f.e]){ s.seen[f.e] = 1; pop(T[f.e].n, cx, py - 110, '#fff', 26); if (fresh) pop('Mới vào sách!', cx, py - 142, '#ffd76a', 18); }
  if (s.score % 7 === 0){ const z = SAY_ZONE[s.zone] || []; speak(SAY.concat(z, z, z), 1); }   // lời theo vùng được ưu tiên gấp ba
  else speak(SAY_ITEM[f.e], 0.4);
  // xét gãy ngay lúc đặt: đặt xuống mà chồng chịu được thì đứng vững tới cú thả sau, lắc qua lắc lại không làm đổ
  s.landT = s.t;
  const brk = stackCheck()[0];
  if (brk >= 0){ breakAt(brk); gameOver('Đổ rồi!'); }
}

// chồng đồ: chuỗi khối nối lò xo, gốc gắn vào đầu capy đang đung đưa
const COMF = 2.2, BONUS_N = 10;
function stepChain(dt){
  const its = s.items, n = its.length;
  if (!n){ s.danger = 0; s.load = 0; return; }
  const kk = 1450 * Math.pow(Math.max(1, n / 30), 2);
  // chồng càng cao lò xo càng cứng; bước tích phân phải đủ nhỏ so với tần số dao động cao nhất (2·√kk), không thì từ ~140 món chồng rung vỡ số.
  // Chồng thấp vẫn chạy đúng một bước như cũ.
  const sub = Math.max(1, Math.ceil(2 * Math.sqrt(kk) * dt / 1.2)), h2 = dt / sub;
  for (let k = 0; k < sub; k++){
    for (let i = 0; i < n; i++){
      const it = its[i], lu = i ? its[i - 1].u : s.baseU, lv = i ? its[i - 1].v : s.baseV;
      let a = -kk * (it.u - lu) - 2.5 * (it.v - lv) - 1.0 * it.v;   // hãm rung: thả lệch thì chồng lắc vài nhịp rồi yên dần
      if (i < n - 1) a += -kk * (it.u - its[i + 1].u) - 2.5 * (it.v - its[i + 1].v);
      it.acc = a;
    }
    for (let i = 0; i < n; i++){ const it = its[i]; it.v += it.acc * h2; it.u += it.v * h2; }
  }
  const st = s.straight > 0 ? Math.exp(-0.99 * dt) : 1;   // "Thẳng tắp!" kéo dài 0.7 giây, kéo thẳng một nửa độ nghiêng còn lại
  for (let i = 0; i < n; i++){
    const it = its[i];
    it.dx *= st;
    it.sqv += (-700 * it.sq - 24 * it.sqv) * dt; it.sq = clamp(it.sq + it.sqv * dt, -0.3, 0.4);
  }
  // đè bẹp theo sức nặng phía trên
  let M = 0;
  for (let i = n - 1; i >= 0; i--){
    const it = its[i], t = T[it.e];
    it.cs += ((0.14 + 0.07 * t.soft) * (1 - Math.exp(-M * 0.085 * t.soft)) - it.cs) * Math.min(1, dt * 8);
    M += it.k * it.k * t.hw * t.hh * t.dn;
  }
  const danger = stackCheck()[1];
  s.load = M; s.danger = danger;
  let h = 0, pc = 0, ph = 0;
  for (let i = 0; i < n; i++){
    const it = its[i], hh = HH(it), c = i ? (it.cs * hh + pc * ph) / (hh + ph) : it.cs;
    h += it.gap * (1 - 0.9 * c); it.h = h; pc = it.cs; ph = hh;
  }
  // gãy chỉ xét lúc đặt món mới (xem stick); ở đây chỉ kêu cọt kẹt vài giây sau khi đặt nếu chồng đã nghiêng nhiều
  if (danger > 0.55 && !s.over && s.t - (s.landT || 0) < 2){   // cọt kẹt dồn dập hơn khi càng gần ngưỡng gãy
    const gap = clamp(0.5 - (danger - 0.55), 0.12, 0.5);
    if (s.t - lastCreak > gap){ lastCreak = s.t; beep(crnd(70, 100) - danger * 20, 0.1, 'square', 0.02 + danger * 0.04); }
  }
}
// kiểm tra chồng theo độ nghiêng thật (dx: lệch tích lũy do các cú thả, không tính phần lắc qua lại của lò xo):
// khớp trượt khi món lệch quá xa món bên dưới, hoặc khi trọng tâm phần bên trên ra khỏi mặt đỡ. Trả về [khớp gãy (-1 nếu không), độ nguy hiểm, khớp yếu nhất]
function stackCheck(){
  const its = s.items; let M = 0, MX = 0, danger = 0, brk = -1, weak = -1;
  for (let i = its.length - 1; i >= 0; i--){
    const it = its[i], t = T[it.e], x = it.dx, m = it.k * it.k * t.hw * t.hh * t.dn;
    M += m; MX += m * x;
    const sx = i ? its[i - 1].dx : 0, sw = i ? HW(its[i - 1]) : 30;
    const d = Math.max(Math.abs(x - sx) / (i ? 0.8 * (HW(it) + sw) : 60), Math.abs(MX / M - sx) / (sw * COMF));
    if (d > danger){ danger = d; weak = i; }
    if (d > 1) brk = i;
  }
  return [brk, danger, weak];
}
// khớp yếu nhất hiện tại (để vẽ cảnh báo). Lúc chơi dùng cùng thước đo với lúc xét gãy; lúc xem lại chỉ có vị trí đã vẽ nên tính theo vị trí đó
function weakJoint(){
  if (!s.items.length) return [-1, 0];
  const [, d, w] = stackCheck(); return [d > 0.5 ? w : -1, d];
}

// va chạm của vật rơi với vật cố định / vật bị điều khiển (lưng capy, món còn trên chồng)
function hit(b, nx, ny, pen, ovx, ovy, dt){
  b.x += nx * pen; b.y += ny * pen;
  const vn = (b.vx - ovx) * nx + (b.vy - ovy) * ny; let jn = 0;
  if (vn < 0){ jn = -(1 + (vn < -90 ? 0.28 : 0)) * vn; b.vx += jn * nx; b.vy += jn * ny; }
  const tx = -ny, ty = nx, vt = (b.vx - ovx) * tx + (b.vy - ovy) * ty - b.va * b.r;
  const lim = 0.5 * (jn + GR * dt * 0.5), jt = clamp(-vt / 3, -lim, lim);
  b.vx += jt * tx; b.vy += jt * ty; b.va -= 2 * jt / b.r;
  return jn;
}
function thud(v){
  if (v < 260 || s.t - lastThud < 0.06) return;
  lastThud = s.t; beep(crnd(110, 170), 0.06, 'sine', Math.min(0.08, v / 9000));
  s.shake = Math.max(s.shake, Math.min(5, v / 250));
}
// vật rơi tự do: lăn có ma sát, va nhau, nổi theo phần chìm
// giữ tối đa BODY_MAX vật nổi; vật cũ hơn chìm hẳn xuống suối rồi bỏ đi, vì va chạm giữa các vật tính theo từng cặp
// (thua với chồng 140 món mà giữ cả 140 vật thì mỗi giây phải xét hơn chục triệu cặp, điện thoại tụt khung)
const BODY_MAX = 24;
function stepBodies(dt){
  const all = s.bodies, its = s.items, hx = cx + s.baseU;
  for (let i = 0; i < all.length - BODY_MAX; i++) all[i].sink = true;
  for (const b of all){
    b.vy += GR * dt;
    const wi = wIdx(b.x), L = WL - wh[wi], d = clamp(b.y + b.r - L, 0, 2 * b.r);
    if (d > 0){
      const q = 1 - d / b.r, f = (Math.acos(q) - q * Math.sqrt(Math.max(0, 1 - q * q))) / Math.PI;
      if (!b.wet){ b.wet = true; if (b.vy > 120) splash(b.x, b.vy); }
      if (b.sink) b.vy = Math.min(b.vy, 150); else b.vy -= GR * f / 0.55 * dt;
      const dm = Math.exp(-4 * f * dt);
      b.vx *= dm; b.vy *= dm; b.va *= Math.exp(-2.5 * f * dt);
      b.vx -= (wh[Math.min(NW - 1, wi + 1)] - wh[Math.max(0, wi - 1)]) * 14 * f * dt;
    } else if (b.y + b.r < L - 12) b.wet = false;
    b.vy = clamp(b.vy, -1500, 1500);
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt;
    if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx) * 0.4; }
    if (b.x > VW - b.r){ b.x = VW - b.r; b.vx = -Math.abs(b.vx) * 0.4; }
  }
  const bs = all.some(b => b.sink) ? all.filter(b => !b.sink) : all;   // vật đang chìm không va chạm nữa
  for (let pass = 0; pass < 3; pass++){
    for (const b of bs){
      // đầu capy: khối bo tròn
      const px = clamp(b.x, hx - 34, hx + 34), py = Math.max(s.bob + 42, b.y);
      let nx = b.x - px, ny = b.y - py, d = Math.hypot(nx, ny);
      if (d < b.r + 42){
        if (d < 0.001){ nx = 0; ny = -1; d = 0; } else { nx /= d; ny /= d; }
        const jn = hit(b, nx, ny, b.r + 42 - d, s.baseV, s.bobV, dt);
        if (ny < -0.5 && jn > 0) s.bobV += Math.min(70, jn * 0.05);
        thud(jn);
      }
      for (let i = its.length - 1; i >= 0; i--){
        const it = its[i], ix = X(it), iy = Y(it), rr2 = b.r + BR(it);
        let ex = b.x - ix, ey = b.y - iy;
        if (Math.abs(ey) > rr2 || Math.abs(ex) > rr2) continue;
        let dd = Math.hypot(ex, ey);
        if (dd >= rr2) continue;
        if (dd < 0.001){ ex = 1; ey = 0; dd = 0; } else { ex /= dd; ey /= dd; }
        const jn = hit(b, ex, ey, rr2 - dd, it.v, 0, dt);
        it.v -= jn * ex * 0.3; it.sqv += Math.min(3, jn * 0.004);
        thud(jn);
      }
    }
    for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++){
      const a = bs[i], b = bs[j], rr2 = a.r + b.r;
      let nx = b.x - a.x, ny = b.y - a.y;
      if (Math.abs(nx) > rr2 || Math.abs(ny) > rr2) continue;
      let d = Math.hypot(nx, ny);
      if (d >= rr2) continue;
      if (d < 0.001){ nx = 1; ny = 0; d = 0; } else { nx /= d; ny /= d; }
      const ia = 1 / a.m, ib = 1 / b.m, is = ia + ib, pen = rr2 - d;

        a.vx -= jn * ia * nx; a.vy -= jn * ia * ny; b.vx += jn * ib * nx; b.vy += jn * ib * ny;
        thud(-vn);
      }
      const tx = -ny, ty = nx;
      const vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty - b.va * b.r - a.va * a.r;

      a.vx -= jt * ia * tx; a.vy -= jt * ia * ty; b.vx += jt * ib * tx; b.vy += jt * ib * ty;
      a.va -= 2 * jt * ia / a.r; b.va -= 2 * jt * ib / b.r;
    }
  }
  if (all.some(b => b.sink && b.y > WL + 320)) s.bodies = all.filter(b => !(b.sink && b.y > WL + 320));   // chìm khuất đáy thì bỏ
}

function ambient(dt){

  for (const p of steam){ p.y -= 26 * dt; p.x += p.vx * dt; p.life -= dt * 0.2; }
  for (let i = steam.length - 1; i >= 0; i--) if (steam[i].life <= 0) steam.splice(i, 1);
  stepFlyers(dt);
  for (const l of leaves){
    l.ph += dt * 1.6;
    if (l.float){ l.x += dt * 0.012; if (l.x > 1.1) l.x = -0.1; }
    else { l.y += 34 * dt; l.x += Math.sin(l.ph) * 0.0009 - dt * 0.01; if (l.y > WL - 2){ l.y = -260 - crand() * 120; l.x = 0.55 + crand() * 0.45; } }

}
function update(dt){
  if (s.stop > 0){ s.stop -= dt; return; }

  const n = s.items.length;
  // capy đung đưa + nhún + lún theo sức nặng
  s.swayPh += dt * 1.5;
  s.B += ((s.over ? 0 : Math.min(3 + n * 0.75, 20)) - s.B) * Math.min(1, dt * 2);   // capy lắc theo chồng, có giới hạn để chồng không tự rung tới đổ
  s.baseU = s.B * Math.sin(s.swayPh); s.baseV = s.B * 1.5 * Math.cos(s.swayPh);
  const windup = s.over && !s.ask && n && s.sneezeT < 0.5;
  const rest = Math.min(26, s.load * 0.8) - (windup ? 9 : 0);
  s.bobV += (-140 * (s.bob - rest) - 9 * s.bobV) * dt; s.bob += s.bobV * dt;
  if (s.straight > 0) s.straight -= dt;
  if (s.nextT < 1) s.nextT = Math.min(1, s.nextT + dt * 5);
  stepChain(dt); stepBodies(dt); stepWater(dt);

  const m = s.items.length, topH = m ? s.items[m - 1].h + HH(s.items[m - 1]) : 0;
  const camT = s.over && !s.ask ? 0 : Math.max(0, topH - s.bob - (DROP_H - TOP_GAP));   // đỉnh chồng luôn cách chim TOP_GAP, màn nào cũng vậy
  s.cam += (camT - s.cam) * Math.min(1, dt * (s.over ? 2.2 : 6));
  s.shake *= Math.exp(-12 * dt);
  if (s.sayT > 0) s.sayT -= dt;
  if (s.blink > 0) s.blink -= dt; else if (crand() < dt * 0.3) s.blink = 0.22;
  for (const p of s.pops) p.t += dt;
  s.pops = s.pops.filter(p => p.t < 0.9);
  for (const r of s.rings) r.t += dt;
  s.rings = s.rings.filter(r => r.t < 0.35);
  for (const r of s.ripples) r.t += dt;
  s.ripples = s.ripples.filter(r => r.t < 0.8);
  for (const p of s.parts){ p.vy += GR * 0.6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.4; if (p.y > WL + 4 && p.vy > 0) p.life = 0; }
  s.parts = s.parts.filter(p => p.life > 0);
  ambient(dt);

  if (s.evoT > 0) s.evoT -= dt;
  if (s.lifeT > 0) s.lifeT -= dt;
  if (s.tipT > 0) s.tipT -= dt;
  if (s.danger > 0.45 && !s.over) tip('lean');
  if (s.over && s.ask){ s.askT -= dt; if (s.askT <= 0) finish(); return; }
  if (s.over){
    s.overT += dt;
    if (s.items.length){ s.sneezeT -= dt; if (s.sneezeT <= 0) sneeze(); }
    return;
  }

  if (s.zone < ZONES.length && altOf(s.cam) > ZONES[s.zone][0]){
    pop(ZONES[s.zone][1], cx, VH * 0.42 - baseY - s.cam, '#fff', 38); s.zone++;
    s.evoT = 0.6; burst(cx + range * Math.sin(s.ph), dropY - 40 - baseY - s.cam, 16, '#fff', 260);
    pop(BIRDS[s.zone].n, cx, VH * 0.42 + 44 - baseY - s.cam, '#ffe066', 22);
    beep(660, 0.12, 'triangle', 0.1); beep(990, 0.25, 'triangle', 0.08);
  }
  // tốc độ nền của chim theo vùng, đổi chim thì tăng đều 0.1 mỗi giây cho khỏi hụt nhịp; cộng thêm phần nhanh dần theo số món như bản cũ
  s.spd = s.spd ? s.spd + clamp(ZSPD[s.zone] - s.spd, -0.1 * dt, 0.1 * dt) : ZSPD[s.zone];
  s.ph += dt * (s.spd + Math.min(n, 80) * 0.006);
  const f = s.fall;
  if (f){
    f.vy += GR * dt; f.y += f.vy * dt; f.a += f.va * dt;
    const top = s.items[s.items.length - 1];
    if (top){
      const tol = (HW(f) + HW(top)) * 0.62, gb = (HH(f) + HH(top)) * 0.94, ddx = f.x - X(top), ty = Y(top);
      if (Math.abs(ddx) <= tol){ if (f.y >= ty - gb * (1 - 0.22 * (ddx / tol) * (ddx / tol))) stick(f, ddx, gb, tol, false); }
      else if (f.y >= ty - gb * 0.5) miss(f, Math.abs(ddx) - tol);
    } else {
      const gb = HH(f) * 0.94;
      if (f.y + gb >= s.bob){
        const d = f.x - (cx + s.baseU);
        if (Math.abs(d) <= 50) stick(f, d, gb, 50, true); else miss(f, Math.abs(d) - 50);
      }
    }
  }
}

function ridge(n, lo, hi, rough){
  const p = [rnd(0, 6), rnd(0, 6), rnd(0, 6), rnd(0, 6)];
  return Array.from({ length: n }, (_, i) => {
    const t = i / (n - 1), v = 0.5 + 0.26 * Math.sin(t * 4.2 + p[0]) + 0.15 * Math.sin(t * 9.7 + p[1]) + 0.07 * Math.sin(t * 21 + p[2]) + rough * Math.sin(t * 63 + p[3]);
    return lo + (hi - lo) * clamp(v, 0, 1);

function drawBack(alt){

      for (const [nx, ny, nr, col] of [[0.25, 0.3, 190, '150,90,220'], [0.8, 0.6, 220, '60,160,200']]){
        const ng = g.createRadialGradient(nx * VW, ny * VH, 10, nx * VW, ny * VH, nr);

        g.fillStyle = ng; g.fillRect(nx * VW - nr, ny * VH - nr, nr * 2, nr * 2);

    for (const st of STARS){

    g.globalAlpha = 1;

  }
  const sunA = clamp(1 - alt / 1500, 0, 1);
  if (sunA > 0){
    const sx = VW * 0.72, sy = VH * 0.12 + alt * 0.05, sg = g.createRadialGradient(sx, sy, 8, sx, sy, 150);
    sg.addColorStop(0, 'rgba(255,250,225,' + sunA + ')'); sg.addColorStop(0.18, 'rgba(255,244,200,' + sunA * 0.55 + ')'); sg.addColorStop(1, 'rgba(255,240,190,0)');

  }

  if (alt > 2000){
    const ea = clamp((alt - 2000) / 400, 0, 1), top = VH * 0.66 + (alt - 2300) * 0.1 + Math.max(0, alt - 2700) * 0.5, er = Math.max(1100, VW * 1.4);

      const eg = g.createLinearGradient(0, top, 0, top + 260); eg.addColorStop(0, '#4fa3ea'); eg.addColorStop(1, '#1c4f9c');
      g.fillStyle = eg; circ(cx, top + er, er);
      g.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 7; i++){ g.beginPath(); g.ellipse(((i * 0.19 + 0.08) % 1) * VW, top + 46 + (i * 41 % 120), 50 + (i * 17 % 40), 9, 0.1, 0, 7); g.fill(); }
      g.fillStyle = 'rgba(90,170,110,0.55)';
      for (let i = 0; i < 4; i++){ g.beginPath(); g.ellipse(((i * 0.31 + 0.2) % 1) * VW, top + 90 + (i * 53 % 110), 60, 22, 0.3, 0, 7); g.fill(); }
      g.globalAlpha = 1;
    }
  }
  for (const L of RIDGES){
    const yb = baseY + SHORE + s.cam * L.p;
    if (yb - 340 > VH) continue;
    const mg = g.createLinearGradient(0, yb - 330, 0, yb); mg.addColorStop(0, L.c0); mg.addColorStop(1, L.c1);
    g.fillStyle = mg; g.beginPath(); g.moveTo(0, VH + 10);

    const y = VH * 0.4 + (alt - c.at) * 0.6, x = ((c.x * VW + s.t * c.sp) % (VW + 300)) - 150;

    g.fillStyle = rf; g.fillRect(0, ys, VW, 54);

// bàn chân capy nhìn từ phía trước: mu bàn chân tròn mập, bốn ngón tròn xếp sát nhau, móng nhỏ màu kem ở đầu ngón
// rot: nghiêng nhẹ, mũi chân chĩa ra ngoài cho tự nhiên
function capyPaw(x0, y0, w, col, rot){
  const r = w * 0.27, ty = y0 + w * 0.22, xs = [-3, -1, 1, 3].map(k => k * r * 0.98);
  g.save(); g.translate(x0, y0); g.rotate(rot || 0); g.translate(-x0, -y0);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const shape = () => {
    g.beginPath(); g.moveTo(x0 + xs[3] + r, ty);
    g.bezierCurveTo(x0 + w * 1.12, y0 - w * 0.95, x0 - w * 1.12, y0 - w * 0.95, x0 + xs[0] - r, ty);   // mu bàn chân
    for (const dx of xs) g.arc(x0 + dx, ty, r, Math.PI, 0, true);                                      // bốn ngón
    g.closePath();
  };
  g.fillStyle = col; shape(); g.fill(); g.strokeStyle = OUT; g.lineWidth = 3; g.stroke();
  g.save(); shape(); g.clip();
  g.fillStyle = 'rgba(255,236,205,0.28)'; g.beginPath(); g.ellipse(x0 - w * 0.12, y0 - w * 0.42, w * 0.5, w * 0.2, -0.15, 0, 7); g.fill();   // ánh sáng trên mu
  g.restore();
  g.strokeStyle = 'rgba(59,42,30,0.55)'; g.lineWidth = 1.6; g.beginPath();   // khe giữa các ngón
  for (let i = 0; i < 3; i++){ const mx = x0 + (xs[i] + xs[i + 1]) / 2; g.moveTo(mx, ty - r * 0.15); g.lineTo(mx, ty - r * 0.85); }
  g.stroke();
  g.fillStyle = '#f2e1c4'; g.strokeStyle = OUT; g.lineWidth = 1.4;   // móng
  for (const dx of xs){ g.beginPath(); g.ellipse(x0 + dx, ty + r * 0.6, r * 0.5, r * 0.36, 0, 0, 7); g.fill(); g.stroke(); }
  g.restore();
}
function drawCapy(){

  capyPaw(-104, 266, 21, '#8a6240', -0.3); capyPaw(104, 266, 21, '#8a6240', 0.3);

  g.fillStyle = 'rgba(70,40,20,0.14)'; g.beginPath(); g.ellipse(0, 150, 110, 30, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,110,110,0.16)'; g.beginPath(); g.ellipse(-70, 78, 12, 7, 0, 0, 7); g.ellipse(70, 78, 12, 7, 0, 0, 7); g.fill();
  g.restore();
  // mõm to, bè
  g.fillStyle = '#8f6240'; g.beginPath(); mirror(g, [[0, 46], [34, 45, 56, 62, 58, 92], [58, 126, 30, 134, 0, 134]]); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,230,200,0.14)'; g.beginPath(); g.ellipse(0, 56, 30, 7, 0, 0, 7); g.fill();
  // mũi to
  g.fillStyle = '#4a2f20'; g.beginPath(); g.ellipse(0, 70, 22, 12, 0, 0, 7); g.fill();
  g.fillStyle = '#1e120c'; g.beginPath(); g.ellipse(-10, 71, 4.5, 3.2, 0.4, 0, 7); g.ellipse(10, 71, 4.5, 3.2, -0.4, 0, 7); g.fill();
  g.strokeStyle = OUT; g.lineWidth = 2.8;

    g.fillStyle = '#2a1a12'; g.beginPath(); g.ellipse(ex, ey, alarm ? 4 : 6.5, alarm ? 4.5 : 5.5, 0, 0, 7); g.fill();
    g.fillStyle = '#fff'; circ(ex - 2, ey + (alarm ? -1.5 : 2.4), 1.4);

      g.fillStyle = '#c69d70'; g.beginPath(); g.ellipse(ex, ey - 0.5, 8.5, 7, 0, Math.PI, 0); g.closePath(); g.fill();

}

function drawBird(x, y, carrying, z){

  if (b.cosmic){ g.save(); g.strokeStyle = 'rgba(190,225,255,0.85)'; g.lineWidth = 2.2; g.beginPath(); g.ellipse(0, 1, 27, 7, -0.3, Math.PI, Math.PI * 2); g.stroke(); g.restore(); }
  for (const sg of [-1, 1]){
    g.save(); g.translate(sg * 10, -3); g.rotate(sg * (-0.35 + fl * 0.65));
    g.fillStyle = b.wing; g.beginPath(); g.moveTo(0, -4); g.quadraticCurveTo(sg * 18, -12, sg * 30, -2); g.quadraticCurveTo(sg * 16, 8, 0, 5); g.closePath(); g.fill(); g.stroke();

  if (b.cosmic){
    g.fillStyle = '#fff'; [[-7, 3, 0], [6, 8, 1], [2, -10, 2], [-3, 10, 3], [9, 0, 4], [-9, -6, 5]].forEach(([px, py, k]) => { g.globalAlpha = 0.45 + 0.55 * Math.sin(s.t * 5 + k * 1.7); circ(px, py, 1.1); }); g.globalAlpha = 1;
    g.save(); g.strokeStyle = 'rgba(190,225,255,0.95)'; g.lineWidth = 2.2; g.beginPath(); g.ellipse(0, 1, 27, 7, -0.3, 0, Math.PI); g.stroke(); g.restore();
  }
  if (b.alien){

// chữ trên nút: textBaseline 'middle' đặt tâm chữ hoa cao hơn tâm nút một chút, nên dời xuống theo chiều cao chữ hoa đo thật
let CAPK = null;
function btxt(str, x, y, size, fill, align){
  if (CAPK === null){ g.font = '900 100px system-ui,"Segoe UI",Roboto,sans-serif'; g.textBaseline = 'middle'; const m = g.measureText('H'); CAPK = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 200 || 0; }

// icon vẽ tay cùng kiểu với chữ trên nút: nền trắng, viền nâu đậm. r: nửa bề rộng
function icon(k, x, y, r){
  const lw = clamp(r * 0.32, 2.6, 4);
  g.save(); g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = OUT; g.lineWidth = lw; g.fillStyle = '#fff';
  // nét trắng có viền nâu (cho mũi tên, dấu tick, dấu X)
  const line = (w, path) => { g.lineWidth = w + lw * 2; g.strokeStyle = OUT; path(); g.stroke(); g.lineWidth = w; g.strokeStyle = '#fff'; path(); g.stroke(); g.lineWidth = lw; g.strokeStyle = OUT; };
  const poly = pts => { g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(x + a * r, y + b * r) : g.moveTo(x + a * r, y + b * r)); g.closePath(); g.fill(); g.stroke(); };

const studioLogo = new Image(); if (STUDIO_LOGO) studioLogo.src = STUDIO_LOGO;
function drawTop(){
  const o = topBtns();
  if (!play && !lib && !book && !isStarted() && studioLogo.complete && studioLogo.naturalWidth) g.drawImage(studioLogo, 12, 24, 34 * studioLogo.naturalWidth / studioLogo.naturalHeight, 34);
  let [x, y] = roundBtn(o.mute);
  x -= 3; g.fillStyle = OUT; g.strokeStyle = OUT;
  g.beginPath(); g.moveTo(x - 9, y - 4); g.lineTo(x - 4, y - 4); g.lineTo(x + 2, y - 10); g.lineTo(x + 2, y + 10); g.lineTo(x - 4, y + 4); g.lineTo(x - 9, y + 4); g.closePath(); g.fill(); g.lineWidth = 2; g.stroke();
  g.lineWidth = 2.6;
  if (muted){ g.strokeStyle = '#d8403c'; g.beginPath(); g.moveTo(x + 6, y - 5); g.lineTo(x + 15, y + 5); g.moveTo(x + 15, y - 5); g.lineTo(x + 6, y + 5); g.stroke(); }
  else { g.beginPath(); g.arc(x + 3, y, 5.5, -0.85, 0.85); g.stroke(); g.beginPath(); g.arc(x + 3, y, 10.5, -0.85, 0.85); g.stroke(); }
  if (o.lang){
    [x, y] = roundBtn(o.lang);
    g.font = '900 15px system-ui,"Segoe UI",Roboto,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = OUT;
    g.fillText(lang === 'vi' ? 'VI' : 'EN', x, y + 1);
  }
  if (o.priv){   // hình cái khiên
    [x, y] = roundBtn(o.priv);
    g.fillStyle = OUT; g.beginPath(); g.moveTo(x, y - 11); g.lineTo(x + 9, y - 7); g.quadraticCurveTo(x + 9, y + 6, x, y + 11); g.quadraticCurveTo(x - 9, y + 6, x - 9, y - 7); g.closePath(); g.fill();
    g.strokeStyle = '#fff3d6'; g.lineWidth = 2.6; g.beginPath(); g.moveTo(x - 4, y); g.lineTo(x - 1, y + 3.5); g.lineTo(x + 4.5, y - 3); g.stroke();
  }
}
function topTap(x, y){
  const o = topBtns();
  if (inBox(o.mute, x, y)){ toggleMute(); return true; }
  if (o.priv && inBox(o.priv, x, y)){ if (AH && AH.showPrivacy) AH.showPrivacy(); return true; }
  if (o.lang && inBox(o.lang, x, y)){ setLang(lang === 'vi' ? 'en' : 'vi'); return true; }
  return false;
}

let last = performance.now();
const ICON = QS.has('icon');   // chỉ dùng để chụp icon app: capy đội ba món, phóng to, không có chữ (xem tools/make_icon.py)

const STEP = 1 / 180; let acc = 0;
// đồng hồ đo ẩn (chạm logo studio 5 lần ở màn hình chờ để bật/tắt): FPS, khung chậm nhất, số bước mô phỏng mỗi khung, số vật, khung replay đã ghi
let perfOn = QS.has('fps'), perfTaps = [];
const perf = { n: 0, t0: 0, worst: 0, steps: 0, fps: 0, slow: 0, spf: 0, dsum: 0, ssum: 0, dms: 0, sms: 0 };
function drawPerf(){
  const r = rec ? rec.ev.length : 0, str = perf.fps + ' fps · chậm ' + perf.slow + ' ms · vẽ ' + perf.dms + ' ms · lý ' + perf.sms + ' ms · ' + perf.spf + ' bước · vật ' + s.bodies.length + ' · món ' + s.items.length + ' · chạm ' + r;
  g.font = '700 12px system-ui,sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(6, VH - 26, g.measureText(str).width + 12, 20); g.fillStyle = perf.fps < 50 ? '#ff8a8a' : '#9effa8'; g.fillText(str, 12, VH - 16);
}
// ---- replay: lưu trạng thái lúc bấm bắt đầu + các lần chạm (kèm số bước mô phỏng), lúc xem thì chạy lại đúng vật lý ----
function tickOnce(){
  if (play){
    const ev = play.d.ev;
    while (play.e < ev.length && ev[play.e][0] <= play.k){ const a = ev[play.e++][1]; if (a === 'd') doDrop(); else if (a === 'r') revive(); else if (a === 'f') finish(); }
    update(STEP); play.k++; tick++; return;
  }
  // bắt đầu ghi đúng lúc rời màn hình chờ: chụp toàn bộ trạng thái có ảnh hưởng tới vật lý (một lần, vài KB)
  if (rec && !rec.s0 && isStarted()){
    rec.s0 = JSON.parse(JSON.stringify(s)); rec.rs = rs; rec.rs2 = rs2; rec.w = [Array.from(wh), Array.from(wv)]; rec.lt = [lastThud, lastPlop, lastCreak]; rec.t0 = tick;
  }
  update(STEP);
  tick++;
}
const bgmAuto = () => bgmSet(lib || help ? 'menu' : play ? 'game' : s.over ? 'off' : isStarted() || s.revived ? 'game' : 'menu');   // nhạc đi theo trạng thái game
function frame(now){
  requestAnimationFrame(frame);   // hẹn khung sau trước, lỡ một khung lỗi thì vòng lặp vẫn chạy tiếp
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (noteT > 0) noteT -= dt;
  bgmAuto();
  let n = 0; const ta = performance.now();
  if (!manual){
    acc += dt * (play ? speed : 1);
    while (acc >= STEP && n++ < 40){ tickOnce(); acc -= STEP; }
    if (n >= 40) acc = 0;
  }
  const tb = performance.now(); perf.ssum += tb - ta;
  draw(); perf.dsum += performance.now() - tb;
  perf.n++; perf.steps += n; perf.worst = Math.max(perf.worst, now - (perf.prev || now)); perf.prev = now;
  if (now - perf.t0 >= 1000){ perf.fps = Math.round(perf.n * 1000 / (now - perf.t0)); perf.slow = Math.round(perf.worst); perf.spf = +(perf.steps / perf.n).toFixed(1); perf.dms = +(perf.dsum / perf.n).toFixed(1); perf.sms = +(perf.ssum / perf.n).toFixed(1); perf.n = perf.steps = perf.worst = perf.dsum = perf.ssum = 0; perf.t0 = now; }
}
requestAnimationFrame(frame);
// bố cục màn hình chờ: tiêu đề phía dưới chim, nút Bắt đầu ở khoảng trống phía trên đầu capy
function menuLay(){
  const w = Math.min(VW - 32, 340), titleY = dropY + Math.max(80, VH * 0.13);

}
// một chữ cái của tiêu đề, vẽ sẵn ra ảnh: khối nổi phía dưới, viền, màu chuyển, vệt bóng nửa trên
const TTC = new Map();
function titleChar(c, size, col, w){
  const K = D * U, key = c + size + col.join() + K;
  let im = TTC.get(key); if (im) return im;
  const cw = w + size * 0.6, ch = size * 1.7, q = document.createElement('canvas');
  q.width = Math.ceil(cw * K); q.height = Math.ceil(ch * K);
  const x = q.getContext('2d'); x.scale(K, K); x.translate(cw / 2, ch / 2 - size * 0.06);
  x.font = '900 ' + size + 'px system-ui,"Segoe UI",Roboto,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.lineWidth = size * 0.24; x.strokeStyle = OUT; x.fillStyle = OUT;
  for (let d = size * 0.1; d > 0; d -= 2){ x.strokeText(c, 0, d); x.fillText(c, 0, d); }   // khối nổi phía dưới
  x.strokeText(c, 0, 0);
  const gr = x.createLinearGradient(0, -size * 0.4, 0, size * 0.4); gr.addColorStop(0, col[0]); gr.addColorStop(1, col[1]);
  x.fillStyle = gr; x.fillText(c, 0, 0);
  x.save(); x.beginPath(); x.rect(-w, -size, w * 2, size * 0.86); x.clip(); x.fillStyle = 'rgba(255,255,255,0.3)'; x.fillText(c, 0, 0); x.restore();
  q.cw = cw; q.ch = ch; TTC.set(key, q); if (TTC.size > 60) TTC.delete(TTC.keys().next().value);
  return q;
}
// tiêu đề: từng chữ cái nảy nhẹ, tô màu chuyển, nổi khối
